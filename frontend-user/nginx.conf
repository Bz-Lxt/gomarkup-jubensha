server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 关掉版本号，别把 nginx 版本白送给扫描器
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的静态资源可以永久缓存；index.html 绝对不能缓存，
    # 否则用户会拿着旧 HTML 去请求已被清掉的旧 chunk，白屏且无法自愈。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── 同源反代 ──
    # 前端不把后端地址烘焙进 JS bundle：一旦烘焙，镜像就只能在「构建时
    # 指定的那个主机和端口」下工作，换台机器或换端口访问就全线报错。
    # 走同源反代后，浏览器只认识自己的 origin，也就没有 CORS 与预检。
    #
    # 用 Docker 内置 DNS + 变量形式的 upstream，而不是写死 proxy_pass
    # http://backend:8080：后者只在启动时解析一次并永久缓存，backend 容器
    # 一旦重建换了 IP，这里就会持续 502 直到前端也重启。
    # 注意变量形式的 proxy_pass 不会自动带上 URI，必须显式拼 $request_uri。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream "backend:8080";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(healthz|readyz)$ {
        set $upstream "backend:8080";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket 反代。Upgrade/Connection 两个头必须显式透传，
    # 否则握手会被降级成普通 HTTP 请求并以 400 收场。
    location /ws/ {
        set $upstream "backend:8080";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 聊天连接空闲时只有心跳，默认 60s 读超时会把它误杀。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA 兜底：任何未命中的路径都交给前端路由处理，
    # 否则刷新 /rooms/12 会直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
